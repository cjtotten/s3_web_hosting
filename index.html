<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    :root {
      --bg: #eef3f1;
      --text: #1d3b4a;
      --link: #1f6f8b;
      --link-hover: #0f4c63;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #12222a;
        --text: #d6e6ea;
        --link: #7cc4dc;
        --link-hover: #a9dcec;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    a {
      font-size: 1.5rem;
      color: var(--link);
      text-underline-offset: 0.25em;
    }
    #map { width: 100vw; height: 100vh; }
    #map[hidden] { display: none; }
    a:hover { color: var(--link-hover); }
    a:focus-visible {
      outline: 3px solid var(--link);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <!-- The href is a no-JS fallback; with JavaScript, clicking opens the interactive map instead -->
  <a id="map-link" href="https://www.freeworldmaps.net/download/maps/download-world-map-hd.jpg">Click to see a map of the world</a>
  <div id="map" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    document.getElementById('map-link').addEventListener('click', function (event) {
      // If Leaflet failed to load (blocked, offline, bad hash), let the link navigate normally.
      if (typeof L === 'undefined') return;

      event.preventDefault();
      var link = this;
      var mapEl = document.getElementById('map');

      try {
        link.hidden = true;
        mapEl.hidden = false;

        var map = L.map(mapEl, { worldCopyJump: true }).setView([20, 0], 2);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, OpenStreetMap contributors'
        }).addTo(map);
      } catch (err) {
        // Restore the link so the page is never left blank.
        mapEl.hidden = true;
        link.hidden = false;
        console.error('Could not load map:', err);
      }
    });
  </script>
</body>
</html>
